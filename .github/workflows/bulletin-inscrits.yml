# Envoie le bulletin de la semaine aux inscrits (liste Brevo) dès qu'un nouveau
# courriel de bulletin arrive sur « main ». C'est la voie principale d'envoi :
# un e-mail où chaque article renvoie vers sa fiche sur pausear.fr.
#
# Réglage à enregistrer une seule fois dans GitHub :
#   Settings → Secrets and variables → Actions → New repository secret
#     BREVO_CLE_API   la clé API Brevo (SMTP & API → Clés API → Générer)
#     BREVO_LISTE_ID  le numéro de la liste « Bulletin Pause AR »
#     BREVO_EXPEDITEUR  l'adresse d'envoi, VALIDÉE dans Brevo (Expéditeurs & IP)
#
# Tant que l'un des trois manque, l'envoi est ignoré sans erreur.

name: Bulletin aux inscrits

on:
  push:
    branches: [main]
    paths:
      - 'bulletin/courriel-2*.html'
  workflow_dispatch:
    inputs:
      fichier:
        description: "Courriel à envoyer (vide = le plus récent)"
        required: false
        default: ''
      essai:
        description: "Essai à blanc (true = ne rien envoyer)"
        required: false
        default: 'false'
      diagnostic:
        description: "Diagnostic seul (true = consulter l'état Brevo, rien envoyer)"
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Diagnostic Brevo
        if: ${{ github.event.inputs.diagnostic == 'true' }}
        env:
          BREVO_CLE_API: ${{ secrets.BREVO_CLE_API }}
          BREVO_LISTE_ID: ${{ secrets.BREVO_LISTE_ID }}
          BREVO_EXPEDITEUR: ${{ secrets.BREVO_EXPEDITEUR }}
        run: node outils/etat-brevo.mjs

      - name: Contrôle qualité des cartes de la semaine (charte de rédaction)
        if: ${{ github.event.inputs.diagnostic != 'true' }}
        run: node outils/controle-cartes.mjs --strict

      - name: Envoyer aux inscrits
        if: ${{ github.event.inputs.diagnostic != 'true' }}
        env:
          BREVO_CLE_API: ${{ secrets.BREVO_CLE_API }}
          BREVO_LISTE_ID: ${{ secrets.BREVO_LISTE_ID }}
          BREVO_EXPEDITEUR: ${{ secrets.BREVO_EXPEDITEUR }}
          FICHIER: ${{ github.event.inputs.fichier }}
          ESSAI: ${{ github.event.inputs.essai }}
        run: |
          OPTS=""
          [ "$ESSAI" = "true" ] && OPTS="--essai"
          if [ -n "$FICHIER" ]; then
            node outils/envoyer-courriel.mjs "$FICHIER" $OPTS
          else
            node outils/envoyer-courriel.mjs $OPTS
          fi
